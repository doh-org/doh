name: 버그 리포트
description: 동작이 잘못된 부분을 보고합니다
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: 재현 절차
      description: 문제가 나타나기까지의 순서를 번호로 적어주세요
      placeholder: |
        1. 지도 화면에서 검색창 진입
        2. "다이소" 입력
        3. 네트워크 로그 확인
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 원래 어떻게 동작해야 하나요
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      description: 실제로는 어떻게 동작하나요
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: 검증 방식
      description: 고쳐졌다고 판단할 기준을 적어주세요
    validations:
      required: true
