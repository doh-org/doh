name: pr-lint

on:
  pull_request:
    types: [opened, edited, synchronize]

# 기본 GITHUB_TOKEN 권한이 축소돼도 PR 제목을 읽을 수 있게 명시
# ("Resource not accessible by integration" 방지)
permissions:
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            docs
            chore
            test
