# fly.toml app configuration file generated for memotrip-api on 2026-07-07T20:31:16+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'memotrip-api'
primary_region = 'nrt'

[build]

# 비밀 아닌 환경변수는 여기서 주입 (비밀값은 flyctl secrets)
[env]
  ENV = 'production'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  # 배포 시 이 체크가 통과해야 새 버전이 트래픽을 받는다 (깨진 릴리스 자동 차단).
  # grace_period는 컨테이너 기동 여유분.
  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
