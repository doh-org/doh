name: doh
description: 지도 기반 여행 계획 공유 앱

publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: '>=3.4.0 <4.0.0'

# sort_pub_dependencies 린트에 맞춰 알파벳순 정렬 (카테고리 주석은 각 항목 오른쪽에)
dependencies:
  dio: ^5.8.0+1 # Network
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_naver_map: ^1.3.0 # Maps
  flutter_riverpod: ^2.6.1 # State management
  flutter_secure_storage: ^10.3.1
  freezed_annotation: ^3.0.0
  geolocator: ^13.0.2
  go_router: ^14.8.1 # Navigation
  json_annotation: ^4.9.0
  marionette_flutter: ^0.6.0
  receive_sharing_intent: '>=1.8.1 <1.9.0' # 외부 앱 → 공유 수신 (1.9.0은 AGP9/Kotlin2.4/compileSdk37 요구 → 현 툴체인과 불호환)
  riverpod_annotation: ^2.6.1
  shared_preferences: ^2.3.4 # Storage
  table_calendar: ^3.1.2
  url_launcher: ^6.3.1 # 외부 지도앱 연동 (네이버지도)
  uuid: ^4.5.3

dev_dependencies:
  build_runner: ^2.4.15
  custom_lint: ^0.7.5
  flutter_launcher_icons: ^0.14.4 # 런처 아이콘 생성
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.0.0
  json_serializable: ^6.9.5
  riverpod_generator: ^2.6.3
  riverpod_lint: ^2.6.3
  shared_preferences_platform_interface: ^2.4.1 # 게스트 테스트: 인메모리 prefs 교체용

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/marker/
    - assets/memotrip_logo.png

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700

# 런처 아이콘 원본
# app_icon.svg → app_icon.png(1024, 배경 포함) / app_icon_fg.png(1024, 배경 투명)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: '#FE8505'
  adaptive_icon_foreground: assets/icon/app_icon_fg.png
  adaptive_icon_foreground_inset: 0 # 안전영역 여백은 app_icon_fg.png에 반영됨 (아트 폭 586/1024)
  min_sdk_android: 21
