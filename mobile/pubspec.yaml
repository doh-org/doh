name: doh
description: 지도 기반 여행 계획 공유 앱

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

# sort_pub_dependencies 린트에 맞춰 알파벳순 정렬 (카테고리 주석은 각 항목 오른쪽에)
dependencies:
  dio: ^5.8.0+1 # Network
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_naver_map: ^1.3.0 # Maps
  flutter_riverpod: ^2.6.1 # State management
  flutter_secure_storage: ^10.3.1
  freezed_annotation: ^3.0.0
  geolocator: ^13.0.2
  go_router: ^14.8.1 # Navigation
  json_annotation: ^4.9.0
  riverpod_annotation: ^2.6.1
  shared_preferences: ^2.3.4 # Storage
  supabase_flutter: ^2.8.4 # Supabase
  table_calendar: ^3.1.2
  url_launcher: ^6.3.1 # 외부 지도앱 연동 (네이버지도)

dev_dependencies:
  build_runner: ^2.4.15
  custom_lint: ^0.7.5
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.0.0
  json_serializable: ^6.9.5
  riverpod_generator: ^2.6.3
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/marker/

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
